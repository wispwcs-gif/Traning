<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Конструктор тренировок</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <div class="badge">🏋️ Training Planner</div>
        <h1>Конструктор тренировок</h1>
        <p>Создавай тренировки по дням, добавляй упражнения, подходы, повторы, ссылки на видео и локальные фото/видео.</p>
      </div>
      <div class="hero-actions">
        <button id="copyPlanBtn" class="btn dark">Скопировать план</button>
        <button id="exportBtn" class="btn light">Скачать JSON</button>
        <label class="btn light file-btn">Загрузить JSON<input id="importInput" type="file" accept="application/json" /></label>
      </div>
    </header>
    <main class="layout">
      <aside class="panel calendar-panel">
        <div class="calendar-head">
          <button id="prevMonth" class="round-btn">‹</button>
          <div><div class="section-label">Календарь</div><h2 id="monthTitle">Месяц</h2></div>
          <button id="nextMonth" class="round-btn">›</button>
        </div>
        <div class="weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
        <div id="calendarGrid" class="calendar-grid"></div>
        <div class="selected-date-box">
          <label>Выбранная дата</label>
          <input id="selectedDateInput" type="date" />
          <button id="createWorkoutBtn" class="btn blue full">Создать тренировку</button>
        </div>
      </aside>
      <section id="workspace" class="workspace"></section>
    </main>
  </div>
  <template id="emptyTemplate"><div class="empty-state"><div class="empty-icon">🏋️</div><h2>На эту дату тренировки пока нет</h2><p>Выбери дату в календаре и создай тренировку.</p></div></template>
  <template id="exerciseTemplate">
    <article class="exercise-card">
      <div class="exercise-top"><div><div class="muted">Упражнение</div><strong class="exercise-number"></strong></div><button class="icon-btn remove-exercise" title="Удалить упражнение">🗑️</button></div>
      <div class="form-grid">
        <label class="wide">Название<input class="exercise-name" type="text" /></label>
        <label>Подходы<input class="exercise-sets" type="number" min="1" /></label>
        <label>Повторы<input class="exercise-reps" type="number" min="1" /></label>
        <label>Вес<input class="exercise-weight" type="text" placeholder="Например: 80 кг" /></label>
        <label>Отдых<input class="exercise-rest" type="text" placeholder="90 сек" /></label>
        <label class="wide">Ссылка на видео<input class="exercise-video" type="url" placeholder="YouTube / Rutube / Google Drive" /></label>
        <label class="wide">Комментарий<textarea class="exercise-comment" rows="3" placeholder="Техника, подсказки, ограничения..."></textarea></label>
        <div class="wide"><label class="upload-box"><span>📷 Добавить фото/видео</span><small>Файлы показываются в карточке, но хранятся только в этом браузере</small><input class="exercise-files" type="file" accept="image/*,video/*" multiple /></label><div class="media-grid"></div></div>
      </div>
    </article>
  </template>
  <script src="src/app.js"></script>
</body>
</html>
